name: Publish plugin release
on:
  push:
  workflow_dispatch:
jobs:
 build-phar:
   name: Build plugin PHAR
   permissions: write-all
   runs-on: ubuntu-latest
   if: contains(github.event.head_commit.message, 'Release')
   steps:
     - name: Checkout the repository.
       uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
     - name: Set up PHP environment
       uses: pmmp/setup-php-action@3c38c259834f945351a662392836d90eb08abff0
       with:
         php-version: 8.3
         install-path: "./bin"
         pm-version-major: 5
     - name: Install php-cs-fixer.
       run: "curl -sL https://github.com/PHP-CS-Fixer/PHP-CS-Fixer/releases/latest/download/php-cs-fixer.phar -o php-cs-fixer"
     - name: Run php-cs-fixer.
       run: "php php-cs-fixer fix src"
     - name: Build plugin PHAR
       run: "php -dphar.readonly=0 tools/build.php"
     - uses: ChanTsune/release-with-commit@5a427bc9fbc54bf678e4c0bf36f4914d138d6b15
       id: create_release
       continue-on-error: true
       with:
          regexp: "Release (\\d+([.]\\d+)*)\n*((\\s|\\S)+)"
          regexp_options: "us"
          release_name: "Zuri Anticheat: v$1"
          tag_name: "v$1"
          body: "$3"
          draft: true
          prerelease: false
       env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
     - name: Upload plugin release asset
       id: upload-release-asset 
       continue-on-error: true
       uses: actions/upload-release-asset@e8f9f06c4b078e705bd2ea027f0926603fc9b4d5
       env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
       with:
          upload_url: ${{ steps.create_release.outputs.upload_url }} # This pulls from the CREATE RELEASE step above, referencing it's ID to get its outputs object, which include a `upload_url`. See this blog post for more info: https://jasonet.co/posts/new-features-of-github-actions/#passing-data-to-future-steps 
          asset_path: ./FakeWaterdogTransfer.phar
          asset_name: FakeWaterdogTransfer.phar
          asset_content_type: application/zip
     - name: Codespace Cleanup
       run: "rm -rf *"
