name: Publish plugin release

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-phar:
    name: Build release PHAR
    if: startsWith(github.event.head_commit.message, 'Release ')
    uses: NhanAZ/DevTools/.github/workflows/build-plugin.yml@b3a02f924b4dafea627deec28e5af3d5462bf5a0
    with:
      axolotl-ref: dfe0d07e48a9e8d5a4a242fa43ff1cd3b743a955
      php-version: '8.3'
      pm-version-major: '5'
      phpstan: max
      artifact-name: FakeWaterdogTransfer-release-${{ github.sha }}
      retention-days: 14

  publish-release:
    name: Publish draft GitHub release
    if: startsWith(github.event.head_commit.message, 'Release ')
    needs: build-phar
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified PHAR artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: FakeWaterdogTransfer-release-${{ github.sha }}
          path: release

      - name: Create draft GitHub release
        shell: bash
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          subject="${COMMIT_MESSAGE%%$'\n'*}"
          if [[ ! "$subject" =~ ^Release\ ([0-9]+([.][0-9]+)*)$ ]]; then
            echo 'The commit subject must match Release x.y.z.' >&2
            exit 2
          fi
          version="${BASH_REMATCH[1]}"
          notes="${COMMIT_MESSAGE#"$subject"}"
          notes="${notes#$'\n'}"
          if [[ -z "$notes" ]]; then
            notes="Release v$version"
          fi
          test -f release/FakeWaterdogTransfer.phar
          gh release create "v$version" release/FakeWaterdogTransfer.phar \
            --repo "$REPOSITORY" \
            --target "$SHA" \
            --title "FakeWaterdogTransfer: v$version" \
            --notes "$notes" \
            --draft
