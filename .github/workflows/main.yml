name: Build and validate FakeWaterdogTransfer plugin

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-phar:
    name: Build plugin PHAR
    uses: AxolotlBucketLabs/DevTools/.github/workflows/build-plugin.yml@latest
    with:
      axolotl-ref: e881fc1bc1c401545baf6bd1f824e41ff3f57bd1
      php-version: '8.4'
      pm-version-major: '5'
      phpstan: max
