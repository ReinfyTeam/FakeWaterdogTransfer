---
# FakeWaterdogTransfer Configuration
# Optimized for 100+ player servers

# Maximum concurrent transfers to prevent chunk loading storms
# When this limit is reached, additional transfers are queued
max-concurrent-transfers: 15

# Chunk loading radius around player during transfer (1-5)
# radius 1 = 3x3 = 9 chunks, radius 2 = 5x5 = 25 chunks, etc.
# Higher values = smoother transfer but more server load
chunk-radius: 2

# Ticks to wait before returning to Overworld after chunks load
# 20 ticks = 1 second. Increase if players still see unloaded chunks.
return-delay-ticks: 10

# Seconds before a stuck transfer is force-cancelled
# Prevents players from being stuck in Nether dimension forever
transfer-timeout-seconds: 30

# Chunks per tick sent to player during normal transfer (4-128)
# Higher = faster terrain load, more CPU. Default 8.
transfer-chunks-per-tick: 8

# Wait until full view distance is loaded before closing fake screen
wait-for-full-view-distance: true

# Radius (chunks) to force-load around player after dimension change (1-32)
# Higher = less glitching, more server load during transfer. Default 8.
forced-chunk-radius: 8

# Chunks per tick during forced load (4-128). Default 32.
forced-chunks-per-tick: 32

# Synchronously load chunks in world before client requests them
force-world-chunk-loading: true

# Temporarily boost player view distance during transfer
temporary-view-distance-boost: true

# Kick players stuck at the fake transfer screen (true/false)
kick-stuck-players: true

# Kick message shown to stuck players
kick-message: "§cYou got stuck during world transfer. Please reconnect."

# Seconds without chunk transfer progress before kicking (5-300)
kick-stuck-after-seconds: 15